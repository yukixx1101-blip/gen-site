<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN SUMIDASHI PDF試験</title><style>body{font-family:-apple-system,sans-serif;background:#f3f5f8;color:#172334;margin:0}header{background:#14283f;color:white;padding:18px;font-size:22px;font-weight:bold}main{padding:14px;max-width:900px;margin:auto}.panel{background:white;padding:15px;border-radius:12px;margin-bottom:12px}button,input,select{font-size:16px;padding:10px;margin:5px 0;max-width:100%}button{background:#0c638d;color:white;border:0;border-radius:8px}canvas{max-width:100%;height:auto;border:1px solid #ccd;touch-action:manipulation}#view{overflow:auto;text-align:center}.small{color:#526477;font-size:13px}#points{white-space:pre-wrap}</style></head><body><header>GEN SUMIDASHI <small>PDF試験版</small></header><main><section class="panel"><b>① 墨出し用途</b><br><select id="purpose"><option>給水・給湯</option><option>排水</option><option>衛生器具</option><option>スリーブ・貫通</option><option>間仕切り・壁</option><option>その他</option></select><p class="small">図面の基準線と現場の基準墨を必ず照合してください。</p></section><section class="panel"><b>② スマホからPDF取込み</b><br><input id="file" type="file" accept="application/pdf,.pdf"><div id="status" class="small">PDFを選択してください。</div><div><button id="prev">前ページ</button> <span id="page">0 / 0</span> <button id="next">次ページ</button></div></section><section class="panel"><b>③ 図面上の位置を登録</b><p class="small">PDFを表示後、図面上をタップすると点を記録します。実寸換算はまだ行いません。</p><div id="view"><canvas id="canvas"></canvas></div><button id="clear">点を消去</button><div id="points"></div></section><section class="panel small">この版はPDF表示・点登録の試験用です。現場測位・±5mm精度は未検証です。PDFはブラウザ内で処理し、サーバーに送信しません。PDF表示ライブラリの取得にネット接続が必要です。</section></main><script type="module">import * as pdfjs from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';let doc=null,n=1,pts=[];const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');async function render(){if(!doc)return;let p=await doc.getPage(n),vp=p.getViewport({scale:1.5});cv.width=vp.width;cv.height=vp.height;await p.render({canvasContext:ctx,viewport:vp}).promise;pts.filter(x=>x.page===n).forEach(x=>{ctx.strokeStyle='#e11d48';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x.x-10,x.y);ctx.lineTo(x.x+10,x.y);ctx.moveTo(x.x,x.y-10);ctx.lineTo(x.x,x.y+10);ctx.stroke()});$('page').textContent=n+' / '+doc.numPages;$('points').textContent=pts.map((x,i)=>(i+1)+'. '+x.page+'ページ：('+Math.round(x.x)+','+Math.round(x.y)+')').join('\n')} $('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('status').textContent='読込み中…';try{doc=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;n=1;pts=[];await render();$('status').textContent=f.name+' を表示しました'}catch(err){$('status').textContent='PDF読込みエラー: '+err.message}};$('prev').onclick=()=>{if(doc&&n>1){n--;render()}};$('next').onclick=()=>{if(doc&&n<doc.numPages){n++;render()}};cv.onclick=e=>{if(!doc)return;let r=cv.getBoundingClientRect();pts.push({page:n,x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height});render()};$('clear').onclick=()=>{pts=[];render()};</script></body></html>
